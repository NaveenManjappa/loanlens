# Lesson 12: on every push to main, run the tests; if they pass, build the image and
# publish it to GitHub Container Registry (ghcr.io). Deploying to Azure stays a manual
# step (docs/deploy-azure.md), so you choose which version goes live.
name: Test and publish image

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies (exactly as locked)
        run: uv sync --frozen
      - name: Run the test suite (fake models only, so no secrets are needed)
        run: uv run pytest -q

  publish:
    needs: test # no image unless every test passes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - name: Image name (ghcr.io names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # what Azure Container Apps runs
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest