[project]
name = "loanlens"
version = "0.1.0"
description = "Agentic loan-underwriting copilot built with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain[openai]>=1.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls the real LLM (run with LOANLENS_LIVE=1)"]
