[project]
name = "loanlens"
version = "0.1.0"
description = "Agentic loan-underwriting copilot built with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain[openai]>=1.4",
    "python-dotenv>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "fastapi>=0.162.1",
    "uvicorn[standard]>=0.54.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real LLM (run with LOANLENS_LIVE=1)"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"


[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, bugbear, modern syntax
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter handles line length

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path"]
